# KrakenDeploy — On-Prem Production Stack
# -----------------------------------------
# Postgres + KrakenDeploy.Server + Caddy reverse-proxy.
# One `docker compose up -d` to bring up a full deployment.
#
# PREREQUISITES
#   1. Copy .env.example to .env and fill in the required values.
#   2. Point your DNS A/AAAA record at this host.
#   3. docker compose up -d
#
# FIRST RUN
#   1. The kraken-init service runs database setup automatically.
#   2. Create the admin user:
#      docker compose exec kraken-server dotnet KrakenDeploy.Server.dll users create-admin --email admin@example.com --password <password>
#   3. Login at https://<your-domain>/

services:
  postgres:
    image: postgres:16-alpine
    container_name: kraken-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krakendeploy}
      POSTGRES_USER: ${POSTGRES_USER:-kraken}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kraken} -d ${POSTGRES_DB:-krakendeploy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kraken-net

  kraken-init:
    image: ${SERVER_IMAGE:-krakendeploy-server:latest}
    container_name: kraken-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__KrakenDb: >
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-krakendeploy};
        Username=${POSTGRES_USER:-kraken};Password=${POSTGRES_PASSWORD}
      # T0-8: `database setup` provisions the data-encryption key (DEK), wrapped
      # under the KEK from Encryption__MasterKey. Without these two, setup would
      # default to Development and wrap the DEK under an EPHEMERAL random key
      # discarded on exit — kraken-server then boots Production with the real
      # ENCRYPTION_KEY and can never unwrap it (CryptographicException on the
      # first sensitive-variable access). They MUST match kraken-server's, and
      # DOTNET_ENVIRONMENT=Production turns a missing key into a clean fail-fast
      # instead of a silent brick.
      Encryption__MasterKey: ${ENCRYPTION_KEY:?Required — base64-encoded 32 bytes}
      # SC7: `database setup` seeds the built-in step packages, and a
      # production server verifies every archive's signature against this
      # public key (AllowUnsignedUploads is false in Production). The image
      # must have been built with the matching PRIVATE key — see
      # Dockerfile.server + deploy/onprem/README.md.
      StepPackages__TrustedPublicKey: /etc/krakendeploy/step-signing.pub.pem
      DOTNET_ENVIRONMENT: Production
    volumes:
      # SC7: step-signing public key (PEM), read-only — same file the
      # kraken-server service mounts.
      - ${STEP_SIGNING_PUBKEY_PATH:?Required — host path to the step-signing public key PEM; see deploy/onprem/README.md}:/etc/krakendeploy/step-signing.pub.pem:ro
    entrypoint:
      - dotnet
      - KrakenDeploy.Server.dll
      - database
      - setup
      - --connection-string
      - >
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-krakendeploy};
        Username=${POSTGRES_USER:-kraken};Password=${POSTGRES_PASSWORD}
    networks:
      - kraken-net

  kraken-server:
    image: ${SERVER_IMAGE:-krakendeploy-server:latest}
    container_name: kraken-server
    restart: unless-stopped
    depends_on:
      kraken-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__KrakenDb: >
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-krakendeploy};
        Username=${POSTGRES_USER:-kraken};Password=${POSTGRES_PASSWORD}
      # T0-9: the image runs as the non-root `kraken` user and only
      # /var/lib/krakendeploy is pre-created + chowned (see Dockerfile.server).
      # DataPath, the DataProtection key ring and the agent binaries all live
      # under it so a non-root process can write, the named volume persists
      # them, and every DataPath-reading code site (all now on Server:DataPath)
      # agrees on one tree.
      Server__DataPath: /var/lib/krakendeploy
      DataProtection__KeyPath: /var/lib/krakendeploy/dataprotection-keys
      AgentUpdate__BinariesPath: /var/lib/krakendeploy/agents
      Agent__JwtSigningKey: ${AGENT_JWT_KEY:?Required — minimum 32 characters}
      Encryption__MasterKey: ${ENCRYPTION_KEY:?Required — base64-encoded 32 bytes}
      KRAKEN_LICENSE_KEY: ${KRAKEN_LICENSE_KEY:-}
      Server__HaMode: ${HA_MODE:-}
      # A7/T1-14: the image is Linux (no DPAPI), so the DataProtection key ring
      # MUST be encrypted at rest with an operator-provided X.509 cert —
      # otherwise anyone who can read the key directory can forge auth +
      # antiforgery cookies, and the server refuses to boot in Production. The
      # PFX is mounted read-only from a host path (DP_CERT_PATH) that is
      # DELIBERATELY OUTSIDE the kraken-data volume: co-locating the key with
      # the ring it protects would defeat the point. See the README for how to
      # generate one. (In an HA pair every node must mount the SAME cert.)
      DataProtection__CertificatePath: /etc/krakendeploy/dp-cert.pfx
      DataProtection__CertificatePassword: ${DP_CERT_PASSWORD:-}
      # SC7: trust anchor for step-package signatures — uploads, catalog
      # installs and the boot seeder all verify against it (the private
      # counterpart signs archives at image build / in the publish CI).
      # Agents installed from this server need the same key configured as
      # StepPackages:TrustedPublicKey to load the packages they download.
      StepPackages__TrustedPublicKey: /etc/krakendeploy/step-signing.pub.pem
      DOTNET_ENVIRONMENT: Production
      # B8: cleartext has no ALPN, so ONE plaintext port cannot serve HTTP/1.1
      # (REST/SignalR/UI via Caddy) and HTTP/2 (the agents' gRPC h2c hop that
      # the Caddyfile forwards). Kestrel answers the h2 preface on a mixed
      # cleartext endpoint with HTTP_1_1_REQUIRED — so the internal hop is
      # split: 5080 HTTP/1.1, 5081 Http2-only h2c (Caddy's gRPC handle targets
      # it). These MUST be Kestrel config endpoints — ASPNETCORE_URLS-created
      # endpoints ignore protocol configuration.
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:5080
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:5081
      Kestrel__Endpoints__Grpc__Protocols: Http2
    volumes:
      - kraken-data:/var/lib/krakendeploy
      # Operator-provided DataProtection cert, read-only. DP_CERT_PATH is a host
      # path to a PFX kept OUTSIDE the data volume (see the env note above).
      - ${DP_CERT_PATH:?Required — host path to the DataProtection PFX; see deploy/onprem/README.md}:/etc/krakendeploy/dp-cert.pfx:ro
      # SC7: step-signing public key (PEM), read-only.
      - ${STEP_SIGNING_PUBKEY_PATH:?Required — host path to the step-signing public key PEM; see deploy/onprem/README.md}:/etc/krakendeploy/step-signing.pub.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kraken-net

  caddy:
    image: caddy:2-alpine
    container_name: kraken-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "caddy version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - kraken-net

volumes:
  pg-data:
    name: kraken-pg-data
  kraken-data:
    name: kraken-data
  caddy-data:
    name: kraken-caddy-data
  caddy-config:
    name: kraken-caddy-config

networks:
  kraken-net:
    name: kraken-net
    driver: bridge
