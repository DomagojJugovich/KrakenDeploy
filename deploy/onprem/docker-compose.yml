# KrakenDeploy — On-Prem Production Stack
# -----------------------------------------
# Postgres + KrakenDeploy.Server + Caddy reverse-proxy.
# One `docker compose up -d` to bring up a full deployment.
#
# PROFILES (BG1/T5/T6)
#   single (default, COMPOSE_PROFILES=single in .env):
#       Caddy -> kraken-server. Upgrades are stop -> `database upgrade` -> start.
#   bluegreen (COMPOSE_PROFILES=bluegreen +
#       KRAKEN_UPSTREAM/KRAKEN_GRPC_UPSTREAM=kraken-router:8080 in .env):
#       Caddy -> kraken-router -> kraken-slot-{1,2,3}. Zero-downtime rolling
#       upgrades: set SLOT<n>_IMAGE + SLOT<n>_RELEASE_ID, `releases register`,
#       health-gate via the X-KD-Release header, `releases flip`, drain, retire.
#       See deploy/onprem/README.md and docs/on-prem-guide.md (blue-green
#       chapter) for the full runbooks — including the stop-the-world runbook
#       for non-additive upgrades.
#   Deployment__Topology is DERIVED from the profile (each profile has its own
#   init service and hardcodes it) — there is no topology variable to forget.
#
# PREREQUISITES
#   1. Copy .env.example to .env and fill in the required values.
#   2. Point your DNS A/AAAA record at this host.
#   3. docker compose up -d
#
# FIRST RUN
#   1. The kraken-init (single) / kraken-init-bluegreen (bluegreen) service runs
#      database setup automatically for its profile's topology.
#   2. Create the admin user:
#      docker compose exec kraken-server dotnet KrakenDeploy.Server.dll users create-admin --email admin@example.com --password <password>
#      (bluegreen profile: exec into kraken-slot-1 instead of kraken-server)
#   3. Login at https://<your-domain>/

# ── Shared shapes (YAML anchors; compose ignores top-level x-* keys) ─────────

# Everything the per-profile init services share except the topology.
x-init-common: &init-common
  image: ${SERVER_IMAGE:-krakendeploy-server:latest}
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    # SC7: step-signing public key (PEM), read-only — same file the
    # server/slot services mount.
    - ${STEP_SIGNING_PUBKEY_PATH:?Required — host path to the step-signing public key PEM; see deploy/onprem/README.md}:/etc/krakendeploy/step-signing.pub.pem:ro
  entrypoint:
    - dotnet
    - KrakenDeploy.Server.dll
    - database
    - setup
    - --connection-string
    - >
      Host=postgres;Port=5432;Database=${POSTGRES_DB:-krakendeploy};
      Username=${POSTGRES_USER:-kraken};Password=${POSTGRES_PASSWORD}
  networks:
    - kraken-net

x-init-env: &init-env
  ConnectionStrings__KrakenDb: >
    Host=postgres;Port=5432;Database=${POSTGRES_DB:-krakendeploy};
    Username=${POSTGRES_USER:-kraken};Password=${POSTGRES_PASSWORD}
  # T0-8: `database setup` provisions the data-encryption key (DEK), wrapped
  # under the KEK from Encryption__MasterKey. Without these two, setup would
  # default to Development and wrap the DEK under an EPHEMERAL random key
  # discarded on exit — kraken-server then boots Production with the real
  # ENCRYPTION_KEY and can never unwrap it (CryptographicException on the
  # first sensitive-variable access). They MUST match kraken-server's, and
  # DOTNET_ENVIRONMENT=Production turns a missing key into a clean fail-fast
  # instead of a silent brick.
  Encryption__MasterKey: ${ENCRYPTION_KEY:?Required — base64-encoded 32 bytes}
  # SC7: `database setup` seeds the built-in step packages, and a
  # production server verifies every archive's signature against this
  # public key (AllowUnsignedUploads is false in Production). The image
  # must have been built with the matching PRIVATE key — see
  # Dockerfile.server + deploy/onprem/README.md.
  StepPackages__TrustedPublicKey: /etc/krakendeploy/step-signing.pub.pem
  DOTNET_ENVIRONMENT: Production

# Everything the three blue-green slots share; per slot only image,
# container_name, Release__Id and Release__SlotNo differ (BG1; the same
# anchor pattern as docker-compose.smoke-bluegreen.yml).
# Three slots is the floor (D-bg-4: one drain overlap). Each slot is one full
# release of the server; identity comes from SLOT<n>_RELEASE_ID and the image
# from SLOT<n>_IMAGE — a rolling upgrade changes only the retired slot's pair,
# then `releases register/flip`. All slots SHARE kraken-data (DP key ring,
# package/artifact store) and the DP cert — co-located slots MUST share the
# DataPath (docs/blue-green-slot-deployment.md, implementation notes).
x-slot-common: &slot-common
  restart: unless-stopped
  profiles: ["bluegreen"]
  depends_on:
    kraken-init-bluegreen:
      condition: service_completed_successfully
  volumes:
    - kraken-data:/var/lib/krakendeploy
    # Operator-provided DataProtection cert, read-only. DP_CERT_PATH is a host
    # path to a PFX kept OUTSIDE the data volume (see kraken-server's env note).
    - ${DP_CERT_PATH:?Required — host path to the DataProtection PFX; see deploy/onprem/README.md}:/etc/krakendeploy/dp-cert.pfx:ro
    # SC7: step-signing public key (PEM), read-only.
    - ${STEP_SIGNING_PUBKEY_PATH:?Required — host path to the step-signing public key PEM; see deploy/onprem/README.md}:/etc/krakendeploy/step-signing.pub.pem:ro
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:5080/healthz || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s
  networks:
    - kraken-net

x-slot-env: &slot-env
  Deployment__Topology: OnPremBlueGreen
  ConnectionStrings__KrakenDb: >
    Host=postgres;Port=5432;Database=${POSTGRES_DB:-krakendeploy};
    Username=${POSTGRES_USER:-kraken};Password=${POSTGRES_PASSWORD}
  Server__DataPath: /var/lib/krakendeploy
  DataProtection__KeyPath: /var/lib/krakendeploy/dataprotection-keys
  AgentUpdate__BinariesPath: /var/lib/krakendeploy/agents
  Agent__JwtSigningKey: ${AGENT_JWT_KEY:?Required — minimum 32 characters}
  Encryption__MasterKey: ${ENCRYPTION_KEY:?Required — base64-encoded 32 bytes}
  KRAKEN_LICENSE_KEY: ${KRAKEN_LICENSE_KEY:-}
  DataProtection__CertificatePath: /etc/krakendeploy/dp-cert.pfx
  DataProtection__CertificatePassword: ${DP_CERT_PASSWORD:-}
  StepPackages__TrustedPublicKey: /etc/krakendeploy/step-signing.pub.pem
  DOTNET_ENVIRONMENT: Production
  Kestrel__Endpoints__Http__Url: http://0.0.0.0:5080
  Kestrel__Endpoints__Http__Protocols: Http1
  Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:5081
  Kestrel__Endpoints__Grpc__Protocols: Http2
  # Drain-watcher inventory + router push-invalidation (best-effort).
  Releases__DrainWatch__SlotUrls__1__0: http://kraken-slot-1:5080
  Releases__DrainWatch__SlotUrls__2__0: http://kraken-slot-2:5080
  Releases__DrainWatch__SlotUrls__3__0: http://kraken-slot-3:5080
  Releases__RouterInvalidateUrls__0: http://kraken-router:8080
  Releases__RouterOpsToken: ${ROUTER_OPS_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: kraken-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krakendeploy}
      POSTGRES_USER: ${POSTGRES_USER:-kraken}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kraken} -d ${POSTGRES_DB:-krakendeploy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kraken-net

  # ── Per-profile init (BG1) ──────────────────────────────────────────────────
  # One init service per profile, each HARDCODING its topology: setup/upgrade
  # behaves per topology (under OnPremBlueGreen it also creates the `platform`
  # schema — release registry — and the shared Hangfire schema, which slot boots
  # never touch), and a forgotten env variable used to initialize OnPrem while
  # the slots booted OnPremBlueGreen and crash-looped on the missing hangfire
  # schema. The topology is now correct by construction; `database setup`'s
  # DB-side platform-schema check is the backstop for hand-run commands.
  kraken-init:
    <<: *init-common
    container_name: kraken-init
    profiles: ["single"]
    environment:
      <<: *init-env
      Deployment__Topology: OnPrem

  kraken-init-bluegreen:
    <<: *init-common
    container_name: kraken-init-bluegreen
    profiles: ["bluegreen"]
    environment:
      <<: *init-env
      Deployment__Topology: OnPremBlueGreen

  kraken-server:
    image: ${SERVER_IMAGE:-krakendeploy-server:latest}
    container_name: kraken-server
    restart: unless-stopped
    # Single-instance topology only — the bluegreen profile replaces this
    # service with kraken-slot-{1,2,3} + kraken-router. COMPOSE_PROFILES in
    # .env selects which set starts (default: single).
    profiles: ["single"]
    depends_on:
      kraken-init:
        condition: service_completed_successfully
    environment:
      Deployment__Topology: OnPrem
      ConnectionStrings__KrakenDb: >
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-krakendeploy};
        Username=${POSTGRES_USER:-kraken};Password=${POSTGRES_PASSWORD}
      # T0-9: the image runs as the non-root `kraken` user and only
      # /var/lib/krakendeploy is pre-created + chowned (see Dockerfile.server).
      # DataPath, the DataProtection key ring and the agent binaries all live
      # under it so a non-root process can write, the named volume persists
      # them, and every DataPath-reading code site (all now on Server:DataPath)
      # agrees on one tree.
      Server__DataPath: /var/lib/krakendeploy
      DataProtection__KeyPath: /var/lib/krakendeploy/dataprotection-keys
      AgentUpdate__BinariesPath: /var/lib/krakendeploy/agents
      Agent__JwtSigningKey: ${AGENT_JWT_KEY:?Required — minimum 32 characters}
      Encryption__MasterKey: ${ENCRYPTION_KEY:?Required — base64-encoded 32 bytes}
      KRAKEN_LICENSE_KEY: ${KRAKEN_LICENSE_KEY:-}
      Server__HaMode: ${HA_MODE:-}
      # A7/T1-14: the image is Linux (no DPAPI), so the DataProtection key ring
      # MUST be encrypted at rest with an operator-provided X.509 cert —
      # otherwise anyone who can read the key directory can forge auth +
      # antiforgery cookies, and the server refuses to boot in Production. The
      # PFX is mounted read-only from a host path (DP_CERT_PATH) that is
      # DELIBERATELY OUTSIDE the kraken-data volume: co-locating the key with
      # the ring it protects would defeat the point. See the README for how to
      # generate one. (In an HA pair every node must mount the SAME cert.)
      DataProtection__CertificatePath: /etc/krakendeploy/dp-cert.pfx
      DataProtection__CertificatePassword: ${DP_CERT_PASSWORD:-}
      # SC7: trust anchor for step-package signatures — uploads, catalog
      # installs and the boot seeder all verify against it (the private
      # counterpart signs archives at image build / in the publish CI).
      # Agents installed from this server need the same key configured as
      # StepPackages:TrustedPublicKey to load the packages they download.
      StepPackages__TrustedPublicKey: /etc/krakendeploy/step-signing.pub.pem
      DOTNET_ENVIRONMENT: Production
      # B8: cleartext has no ALPN, so ONE plaintext port cannot serve HTTP/1.1
      # (REST/SignalR/UI via Caddy) and HTTP/2 (the agents' gRPC h2c hop that
      # the Caddyfile forwards). Kestrel answers the h2 preface on a mixed
      # cleartext endpoint with HTTP_1_1_REQUIRED — so the internal hop is
      # split: 5080 HTTP/1.1, 5081 Http2-only h2c (Caddy's gRPC handle targets
      # it). These MUST be Kestrel config endpoints — ASPNETCORE_URLS-created
      # endpoints ignore protocol configuration.
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:5080
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:5081
      Kestrel__Endpoints__Grpc__Protocols: Http2
    volumes:
      - kraken-data:/var/lib/krakendeploy
      # Operator-provided DataProtection cert, read-only. DP_CERT_PATH is a host
      # path to a PFX kept OUTSIDE the data volume (see the env note above).
      - ${DP_CERT_PATH:?Required — host path to the DataProtection PFX; see deploy/onprem/README.md}:/etc/krakendeploy/dp-cert.pfx:ro
      # SC7: step-signing public key (PEM), read-only.
      - ${STEP_SIGNING_PUBKEY_PATH:?Required — host path to the step-signing public key PEM; see deploy/onprem/README.md}:/etc/krakendeploy/step-signing.pub.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kraken-net

  # ── Blue-green slots (bluegreen profile; BG1) ─────────────────────────────
  # Shared shape in x-slot-common / x-slot-env above.
  kraken-slot-1:
    <<: *slot-common
    image: ${SLOT1_IMAGE:-krakendeploy-server:latest}
    container_name: kraken-slot-1
    environment:
      <<: *slot-env
      Release__Id: ${SLOT1_RELEASE_ID:-}
      Release__SlotNo: "1"

  kraken-slot-2:
    <<: *slot-common
    image: ${SLOT2_IMAGE:-krakendeploy-server:latest}
    container_name: kraken-slot-2
    environment:
      <<: *slot-env
      Release__Id: ${SLOT2_RELEASE_ID:-}
      Release__SlotNo: "2"

  kraken-slot-3:
    <<: *slot-common
    image: ${SLOT3_IMAGE:-krakendeploy-server:latest}
    container_name: kraken-slot-3
    environment:
      <<: *slot-env
      Release__Id: ${SLOT3_RELEASE_ID:-}
      Release__SlotNo: "3"

  # ── Per-node slot router (bluegreen profile; BG1/T5) ──────────────────────
  # The node's entry point: Caddy fronts it (TLS stays at Caddy — the router
  # never terminates TLS) and it pins sessions to releases by the kd_ver
  # cookie / X-KD-Release header, reading the registry from KrakenDb's
  # `platform` schema. Search Path resolves the router's unqualified table
  # names — router code is topology-agnostic.
  kraken-router:
    image: ${ROUTER_IMAGE:-krakendeploy-router:latest}
    container_name: kraken-router
    restart: unless-stopped
    profiles: ["bluegreen"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Catalog: >
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-krakendeploy};
        Username=${POSTGRES_USER:-kraken};Password=${POSTGRES_PASSWORD};
        Search Path=platform
      Router__OpsToken: ${ROUTER_OPS_TOKEN:-}
      Router__Slots__1: http://kraken-slot-1:5080
      Router__Slots__2: http://kraken-slot-2:5080
      Router__Slots__3: http://kraken-slot-3:5080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/kd-router/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kraken-net

  caddy:
    image: caddy:2-alpine
    container_name: kraken-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # BG1/T5: profile-dependent upstream (see Caddyfile header). Defaults are
      # the single profile's kraken-server; the bluegreen profile sets both to
      # kraken-router:8080 in .env.
      KRAKEN_UPSTREAM: ${KRAKEN_UPSTREAM:-kraken-server:5080}
      KRAKEN_GRPC_UPSTREAM: ${KRAKEN_GRPC_UPSTREAM:-kraken-server:5080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "caddy version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - kraken-net

volumes:
  pg-data:
    name: kraken-pg-data
  kraken-data:
    name: kraken-data
  caddy-data:
    name: kraken-caddy-data
  caddy-config:
    name: kraken-caddy-config

networks:
  kraken-net:
    name: kraken-net
    driver: bridge
