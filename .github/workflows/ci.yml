name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same ref when a new one is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BG1/T10 layer 2 — storage-schema package watch: a bump of a package that
  # OWNS an on-disk storage schema (Hangfire.PostgreSql migrates the shared
  # `hangfire` schema in place; an EF/Npgsql MAJOR can change migration SQL
  # semantics) is a stop-the-world event for blue-green installs, because a
  # slot boot never auto-migrates shared storage (PrepareSchemaIfNecessary=false)
  # and `database upgrade` refuses it while another release is live. This job
  # makes that knowledge unmissable at REVIEW time: a PR touching those lines in
  # Directory.Packages.props fails unless its title or a commit message carries
  # the literal token [stop-the-world] — acknowledging the release notes must
  # declare a stop window.
  storage-package-watch:
    name: Storage-schema package watch
    runs-on: ubuntu-latest
    # Runs on PRs (the review-time gate) AND on pushes to main: this repo often
    # lands work by direct merge-push, which never opens a PR, so without the
    # push arm the layer-2 guard never fired. On a push it flags AFTER the bump
    # has landed — still the knowledge-transfer net: the failure is loud on main
    # and names the missing [stop-the-world] acknowledgement before the release
    # notes ship.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Flag storage-schema-owning package bumps
        env:
          EVENT_NAME: ${{ github.event_name }}
          # PR: base..head of the PR. Push: the pushed range (event.before can be
          # all-zeros for a brand-new ref — handled below). PR_TITLE is empty on
          # push, so only the commit-message scan applies there.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && { [ -z "$BASE_SHA" ] || echo "$BASE_SHA" | grep -qE '^0+$'; }; then
            BASE_SHA=$(git rev-parse "$HEAD_SHA^")
          fi
          WATCH='Hangfire\.PostgreSql|Hangfire\.AspNetCore|Npgsql|Microsoft\.EntityFrameworkCore'
          changed=$(git diff "$BASE_SHA".."$HEAD_SHA" -- Directory.Packages.props \
            | grep -E '^[+-].*PackageVersion' | grep -E "$WATCH" || true)
          if [ -z "$changed" ]; then
            echo "No storage-schema-owning package changes."
            exit 0
          fi
          echo "Storage-schema-owning package lines changed:"
          echo "$changed"
          if echo "$PR_TITLE" | grep -qF '[stop-the-world]' \
             || git log --format=%B "$BASE_SHA".."$HEAD_SHA" | grep -qF '[stop-the-world]'; then
            echo "::warning::Storage-schema package bump acknowledged as [stop-the-world] — release notes must declare the stop window (docs/on-prem-guide.md, non-additive runbook)."
            exit 0
          fi
          echo "::error::This change bumps a storage-schema-owning package (Hangfire.PostgreSql / Hangfire.AspNetCore / Npgsql / EF Core). For blue-green installs that is a STOP-THE-WORLD upgrade event (BG1/T4/T10): slot boots never auto-migrate shared storage, and 'database upgrade' will refuse while another release is live. Acknowledge it by putting the literal token [stop-the-world] in the PR title or a commit message, and declare the stop window in the release notes."
          exit 1

  build-and-test:
    name: Build & Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # global.json pins SDK 10.0.300 with rollForward: latestFeature, so any
      # 10.0.3xx+ SDK satisfies it. GitHub runners ship .NET 10 preinstalled, so
      # this step is belt-and-suspenders: it guarantees a 10.0 SDK is present in
      # case a runner image lags. (The project began on .NET 9 and was upgraded
      # to .NET 10 — hence the old 9.0.x install this replaces.)
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KrakenDeploy.sln

      # TreatWarningsAsErrors=true in Directory.Build.props means any
      # new IDE/analyzer warning will fail the build here before merging.
      - name: Build
        run: dotnet build KrakenDeploy.sln --no-restore --configuration Release

      # Testcontainers.PostgreSql pulls a postgres:16 (Linux) image at test time.
      # Linux runners run the full suite. Ryuk (the cleanup sidecar) is disabled
      # because it can be flaky on Windows runner networking.
      - name: Test (Linux — full suite incl. Testcontainers)
        if: runner.os != 'Windows'
        run: dotnet test KrakenDeploy.sln --no-build --configuration Release --logger trx --results-directory TestResults
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      # GitHub windows-latest runners can't run Linux Docker containers, so the
      # Testcontainers (Postgres) tests can't start there. They're tagged
      # [Trait("Category","Docker")]; skip them on Windows and rely on the Linux
      # job for container coverage. Everything else still runs on Windows.
      - name: Test (Windows — skip Docker/Testcontainers)
        if: runner.os == 'Windows'
        run: dotnet test KrakenDeploy.sln --no-build --configuration Release --logger trx --results-directory TestResults --filter "Category!=Docker"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    # B8: the single-instance smoke now triggers a REAL deployment (agent
    # round trip), so it runs on PRs too — a wire-contract drift must fail
    # the PR, not land on main first. The heavier multi-account and
    # blue-green smokes stay push-to-main only (step-level conditions).
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run smoke test (single-instance)
        run: bash scripts/smoke-test.sh

      # Multi-account (SaaS, DB-per-account) real-agent smoke. Runs in the SAME
      # job so the server/agent image layers built above are cached and reused
      # (a separate job runs on a fresh runner with no Docker cache, doubling the
      # ~image build cost). Each script tears its own compose stack down on exit.
      #
      # KNOWN RED — non-blocking on purpose. The stack runs Deployment__Topology=
      # Saas, and Program.cs fails fast on it: "Envelope encryption (M13.D.2)
      # does not yet support Deployment:Topology=Saas" — the server exits at
      # boot, so the health probe just runs out its window ("did not become
      # healthy in time" is the SYMPTOM, not a flake). Unblocked only by
      # per-account DEK/KEK (WP12, inside D5-FOLD — POST-go-live). Without
      # continue-on-error this step would abort the whole job, hiding real
      # regressions in the other smokes. It still surfaces as a red annotation
      # on every run. REMOVE this continue-on-error when WP12 lands (it is in
      # WP12's acceptance criteria) — the blue-green step below no longer
      # carries one: BG1 re-keyed it to Topology=OnPremBlueGreen, where the DEK
      # is single-instance and the smoke passes.
      - name: Run smoke test (multi-account SaaS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: bash scripts/smoke-multiaccount.sh

      # Blue-green slot-router smoke: two live "releases" behind the per-node
      # router — cookie pinning, pre-flip health-gate, flip, drain, retire
      # (docs/blue-green-slot-deployment.md §8). Reuses the server image layers
      # built above; adds only the small router image.
      #
      # GREEN AND BLOCKING (BG1/T8): the stack runs the ON-PREM blue-green
      # topology (Deployment__Topology=OnPremBlueGreen — registry + router on
      # KrakenDb's `platform` schema, no multi-account config, no catalog), so
      # the M13.D.2 DEK fail-fast no longer applies. A failure here fails the
      # push — do NOT re-add continue-on-error; fix the regression.
      - name: Run smoke test (blue-green slot router)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/smoke-bluegreen.sh
