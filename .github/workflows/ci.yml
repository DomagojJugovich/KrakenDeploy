name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same ref when a new one is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # global.json pins SDK 10.0.300 with rollForward: latestFeature, so any
      # 10.0.3xx+ SDK satisfies it. GitHub runners ship .NET 10 preinstalled, so
      # this step is belt-and-suspenders: it guarantees a 10.0 SDK is present in
      # case a runner image lags. (The project began on .NET 9 and was upgraded
      # to .NET 10 — hence the old 9.0.x install this replaces.)
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KrakenDeploy.sln

      # TreatWarningsAsErrors=true in Directory.Build.props means any
      # new IDE/analyzer warning will fail the build here before merging.
      - name: Build
        run: dotnet build KrakenDeploy.sln --no-restore --configuration Release

      # Testcontainers.PostgreSql pulls a postgres:16 (Linux) image at test time.
      # Linux runners run the full suite. Ryuk (the cleanup sidecar) is disabled
      # because it can be flaky on Windows runner networking.
      - name: Test (Linux — full suite incl. Testcontainers)
        if: runner.os != 'Windows'
        run: dotnet test KrakenDeploy.sln --no-build --configuration Release --logger trx --results-directory TestResults
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      # GitHub windows-latest runners can't run Linux Docker containers, so the
      # Testcontainers (Postgres) tests can't start there. They're tagged
      # [Trait("Category","Docker")]; skip them on Windows and rely on the Linux
      # job for container coverage. Everything else still runs on Windows.
      - name: Test (Windows — skip Docker/Testcontainers)
        if: runner.os == 'Windows'
        run: dotnet test KrakenDeploy.sln --no-build --configuration Release --logger trx --results-directory TestResults --filter "Category!=Docker"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    # B8: the single-instance smoke now triggers a REAL deployment (agent
    # round trip), so it runs on PRs too — a wire-contract drift must fail
    # the PR, not land on main first. The heavier multi-account and
    # blue-green smokes stay push-to-main only (step-level conditions).
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run smoke test (single-instance)
        run: bash scripts/smoke-test.sh

      # Multi-account (SaaS, DB-per-account) real-agent smoke. Runs in the SAME
      # job so the server/agent image layers built above are cached and reused
      # (a separate job runs on a fresh runner with no Docker cache, doubling the
      # ~image build cost). Each script tears its own compose stack down on exit.
      #
      # KNOWN RED — non-blocking on purpose, together with the blue-green step
      # below. BOTH stacks set MultiAccount__Enabled, and Program.cs fails fast on
      # it: "Envelope encryption (M13.D.2) does not yet support
      # MultiAccount:Enabled" — the server exits at boot, so the health probe just
      # runs out its window ("did not become healthy in time" is the SYMPTOM, not
      # a flake). Unblocked only by per-account DEK/KEK (WP12, inside D5-FOLD —
      # POST-go-live). Without continue-on-error this step aborted the whole job,
      # so the blue-green smoke never ran at all and main sat permanently red,
      # hiding real regressions in the single-instance smoke and both test legs.
      # Both steps still surface as red annotations on every run.
      # REMOVE both continue-on-error lines when WP12 lands (it is in WP12's
      # acceptance criteria) — otherwise a genuinely fixed SaaS path looks
      # identical to a broken one.
      - name: Run smoke test (multi-account SaaS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: bash scripts/smoke-multiaccount.sh

      # Blue-green slot-router smoke: two live "releases" behind the per-node
      # router — cookie pinning, pre-flip health-gate, flip, drain, retire
      # (docs/blue-green-slot-deployment.md §8). Reuses the server image layers
      # built above; adds only the small router image.
      #
      # KNOWN RED for the SAME root cause as the multi-account step above, and
      # non-blocking for the same reason. Blue-green is multi-account-only BY
      # DESIGN (decision D-bg-5: single-node installs upgrade stop → migrate →
      # start; ReleaseRegistry lives in the ControlPlane catalog, which
      # Program.cs only wires up under MultiAccount, and `releases flip/retire`
      # refuses with exit 1 without it). So this stack MUST set
      # MultiAccount__Enabled and therefore MUST hit the M13.D.2 DEK fail-fast —
      # it cannot be made to pass by reconfiguring it. WP12 unblocks both.
      - name: Run smoke test (blue-green slot router)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: bash scripts/smoke-bluegreen.sh
