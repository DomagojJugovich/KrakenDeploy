services:
  postgres:
    image: postgres:16-alpine
    container_name: krakendeploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: krakendeploy_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d krakendeploy_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: krakendeploy-postgres-data
