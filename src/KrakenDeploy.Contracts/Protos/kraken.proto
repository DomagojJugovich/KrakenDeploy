syntax = "proto3";

package krakendeploy.v1;
option csharp_namespace = "KrakenDeploy.Contracts.Grpc";

// ── Package delivery ─────────────────────────────────────────────────────────
// The agent calls Download(); the server streams the package file in chunks.
// Authentication uses the same agent JWT delivered via the Authorization header.
//
// Delta transfer:
//   Set base_version to the version the agent already has in its local cache.
//   The server will stream an Octodiff delta (is_delta = true) instead of the
//   full zip.  The agent applies the delta to its cached copy to produce the
//   target version, which is then stored in the cache.
//
// Resumable full transfer:
//   Set resume_offset to the number of bytes already written to resume a
//   previously interrupted full download.

service PackageDelivery {
    rpc Download(DownloadRequest) returns (stream DownloadChunk);
}

message DownloadRequest {
    string package_id    = 1;
    string version       = 2;
    // Optional: if set and the server can find the base package, the response
    // will be an Octodiff delta (base_version → version) rather than the full file.
    string base_version  = 3;
    // Optional: byte offset into the full file at which to resume streaming.
    // Ignored when base_version is also set.
    int64  resume_offset = 4;
}

message DownloadChunk {
    bytes  data        = 1;
    // Populated only on the first chunk; 0 on subsequent chunks.
    // When is_delta is true this is the delta size, not the final zip size.
    int64  total_bytes = 2;
    bool   is_last     = 3;
    // True when the stream contains Octodiff delta bytes rather than the raw zip.
    bool   is_delta    = 4;
    // SHA-256 of the full zip, lower-case hex. Populated only on the LAST chunk
    // of a NON-delta, non-resumed transfer; empty otherwise. The agent verifies
    // the assembled zip before caching/extracting. Delta transfers are integrity-
    // checked end-to-end by Octodiff's DeltaApplier instead.
    string sha256      = 5;
}

// ── Step-package delivery (Phase D-5) ──────────────────────────────────────
// The agent calls DownloadStepPackage(); the server streams the raw
// .kdeploy-step archive bytes in chunks. Same JWT auth as PackageDelivery.
// Resumable downloads are NOT supported on this surface — packages are
// small (typically a few MB) so a clean re-fetch on failure is simpler than
// resumption bookkeeping. SHA-256 verification of the assembled archive
// happens on the agent side after the last chunk.

service StepPackageDelivery {
    rpc DownloadStepPackage(StepPackageDownloadRequest) returns (stream StepPackageChunk);
}

message StepPackageDownloadRequest {
    // Manifest id (e.g. "kraken.iis").
    string name    = 1;
    // Semver version string (e.g. "1.0.0").
    string version = 2;
}

message StepPackageChunk {
    bytes  data        = 1;
    // Populated only on the first chunk; 0 on subsequent chunks.
    int64  total_bytes = 2;
    bool   is_last     = 3;
    // SHA-256 of the assembled archive, lower-case hex. Populated only on
    // the LAST chunk (when is_last = true). Agent verifies after assembly.
    string sha256      = 4;
}

// ── Artifact upload ───────────────────────────────────────────────────────────
// After each deployment step the agent streams back any files found in the
// step's artifact directory.  Authentication uses the same agent JWT.

service ArtifactUpload {
    // Client-streaming: agent sends header fields in the first chunk,
    // then raw file bytes until is_last = true.
    rpc Upload(stream ArtifactChunk) returns (ArtifactUploadResult);
}

message ArtifactChunk {
    // Populated only on the FIRST message.
    string deployment_id = 1;
    string step_name     = 2;
    string file_name     = 3;
    string content_type  = 4;
    // Every message.
    bytes  data          = 5;
    bool   is_last       = 6;
}

message ArtifactUploadResult {
    string artifact_id = 1;
    bool   success     = 2;
    string error       = 3;
}
